<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Scorecard</title>
<meta name="theme-color" content="#1F5641" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="stylesheet" href="./styles.css" />
<script src="./version.js"></script>
<script>
(function () {
  var booted = false, shown = false;
  function esc(s){ var d=document.createElement("div"); d.textContent = s==null?"":s; return d.innerHTML; }
  window.__scorecardBooted = function(){ booted = true; };
  window.showFatal = function (title, detail, hint) {
    if (shown) return; shown = true;
    var v = document.getElementById("view"); if (!v) return;
    v.innerHTML = '<div class="fatal"><div class="fatal-mark">!</div><h2>' + esc(title) + "</h2>" +
      (hint ? "<p>" + esc(hint) + "</p>" : "") +
      '<button class="btn" id="reloadBtn">Reload</button>' +
      (detail ? '<details><summary>Technical detail</summary><pre>' + esc(detail) + "</pre></details>" : "") +
      '<p class="small muted">Your rounds are safe.</p></div>';
    var b = document.getElementById("reloadBtn"); if (b) b.onclick = function(){ location.reload(); };
  };
  window.showBanner = function (title, detail) {
    var a = document.getElementById("alert"); if (!a) return;
    a.hidden = false;
    a.innerHTML = "<b>" + esc(title) + "</b> " + esc(detail || "");
  };
  window.addEventListener("error", function (e) {
    var opaque = !e.filename && (!e.message || /^script error/i.test(e.message));
    if (opaque) return;
    if (booted) { window.showBanner("Something went wrong", e.message); return; }
    window.showFatal("The app couldn't start", (e.message || "Script error") + (e.filename ? "  (" + e.filename.split("/").pop() + ")" : ""),
      /firebase-config/.test(e.filename || "") ? "firebase-config.js could not be read — usually a missing quote or comma." : "");
  });
  window.addEventListener("unhandledrejection", function (e) {
    var m = (e.reason && (e.reason.message || e.reason.code)) || String(e.reason || "Unknown error");
    if (booted) { window.showBanner("Something went wrong", m); return; }
    window.showFatal("The app couldn't start", m, "");
  });
  setTimeout(function () {
    if (!booted) window.showFatal("The app didn't finish loading", "No screen was drawn within 8 seconds.",
      "If you just edited firebase-config.js, check it for a missing quote or comma.");
  }, 8000);
})();
</script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>The Scorecard</h1>
      <p id="brandSub">Handicap tracking</p>
    </div>
    <div class="top-actions">
      <button id="sizeBtn" class="chip" aria-label="Text size">A</button>
      <button id="themeBtn" class="chip" aria-label="Appearance">Auto</button>
      <button id="statusBtn" class="chip">Starting</button>
    </div>
  </header>

  <div id="busy" class="busy" role="status" hidden></div>
  <div id="alert" class="alert" role="alert" hidden></div>

  <main id="view" aria-live="polite"><div class="boot">Opening your scorecard…</div></main>

  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div id="sheet" class="sheet" hidden></div>

  <script type="module" src="./app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function(){ navigator.serviceWorker.register("./sw.js").catch(function(){}); });
    }
  </script>
</body>
</html>
