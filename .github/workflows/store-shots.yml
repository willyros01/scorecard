name: App Store pictures (made-up golfers)

# Step 26 (Willy, 31 Oct 2026): App Store pictures from a made-up group, never
# real members. Runs the real app against the Firebase emulators only and
# saves the pictures to the ci-logs branch (logs/store-shots/...).
on:
  workflow_dispatch:
  push:
    branches: [v2]
    paths:
      - test/app/store-shots.mjs
      - .github/workflows/store-shots.yml

permissions:
  contents: write   # only to save the pictures to the ci-logs branch

jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Firebase emulators (exact version)
        run: npm install -g firebase-tools@15.31.0
      - name: Packages and a fresh Firebase bundle
        run: |
          npm ci --no-audit --no-fund
          npm run -s bundle
      - name: Chromium
        run: |
          for try in 1 2 3; do timeout 480 npx playwright install --with-deps chromium && break; sleep 5; done
      - name: Make the pictures
        id: shots
        run: |
          set -o pipefail
          cp firestore.rules test/ops/firestore.rules.copy
          cd test/ops
          firebase emulators:exec --only firestore,auth --project demo-scorecard "node ../app/store-shots.mjs ../.. ../../store-shots" 2>&1 | tee ../../store-shots.log
      - name: Save the pictures to the ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/save-logs.sh store-shots "${{ steps.shots.outcome }}" store-shots.log store-shots/*.png
