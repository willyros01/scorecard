name: Scorecard Android APK test build

on:
  push:
    branches: [android]
    paths:
      - "app.js"
      - "platform.js"
      - "styles.css"
      - "index.html"
      - "store.js"
      - "model.js"
      - "outbox.js"
      - "firebase-config.js"
      - "version.js"
      - "build/www-files.txt"
      - "build/approved-versions.json"
      - "package-lock.json"
      - "icon.svg"
      - "package.json"
      - "capacitor.config.json"
      - "build/android-build.sh"
      - "build/android-sign.sh"
      - "build/test-android.cjs"
      - "build/android-native.sh"
      - "build/AndroidIcons.java"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-android-apk
  cancel-in-progress: true

jobs:
  check:
    name: Android adapter and launcher checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Check Android adapter and full JavaScript syntax
        run: node build/test-android.cjs
      - name: Generate and verify Android launcher resources
        run: |
          java build/AndroidIcons.java "$RUNNER_TEMP/cloudfiles-icons"
          test -s "$RUNNER_TEMP/cloudfiles-icons/mipmap-mdpi/ic_launcher.png"
          test -s "$RUNNER_TEMP/cloudfiles-icons/mipmap-xxxhdpi/ic_launcher_foreground.png"
          test -s "$RUNNER_TEMP/cloudfiles-icons/mipmap-anydpi-v26/ic_launcher.xml"
      - name: Check build script syntax
        run: |
          bash -n build/android-build.sh
          bash -n build/android-native.sh
          bash -n build/android-sign.sh

  apk:
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SCORECARD_ANDROID_KEYSTORE_BASE64: ${{ secrets.SCORECARD_ANDROID_KEYSTORE_BASE64 }}
      SCORECARD_ANDROID_PASSWORD: ${{ secrets.SCORECARD_ANDROID_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Require permanent Android signing secrets
        run: |
          if [ -z "$SCORECARD_ANDROID_KEYSTORE_BASE64" ] || [ -z "$SCORECARD_ANDROID_PASSWORD" ]; then
            echo "::error title=Android signing not configured::Set SCORECARD_ANDROID_KEYSTORE_BASE64 and SCORECARD_ANDROID_PASSWORD in repository Actions secrets; refusing an ephemeral debug-signed APK."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Check preinstalled Android SDK
        run: |
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms"
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
      - name: Build permanently signed Android test APK
        run: bash build/android-build.sh
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-android-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  report:
    name: Record APK result
    if: ${{ always() }}
    needs: [apk]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Save latest result for automated monitoring
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const result = '${{ needs.apk.result }}';
            const report = {
              workflow: 'Scorecard Android APK test build',
              branch: 'android',
              run_id: runId,
              run_attempt: process.env.GITHUB_RUN_ATTEMPT,
              run_url: `https://github.com/${owner}/${repo}/actions/runs/${runId}`,
              source_sha: context.sha,
              outcome: result,
              artifact_name: result === 'success' ? 'scorecard-android-test-apk' : null,
              publication: {
                destination: 'https://www.cuberoot-systems.com/downloads/scorecard.apk',
                state: result === 'success' ? 'queued-for-cuberoot-publisher' : 'not-requested',
                mechanism: 'Cuberoot publisher polls this verified build report'
              },
              reported_at: new Date().toISOString(),
              jobs: []
            };
            try {
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                { owner, repo, run_id: runId, per_page: 100 }
              );
              report.jobs = jobs.filter(j => j.name !== 'Record APK result').map(j => ({
                name: j.name,
                conclusion: j.conclusion,
                failed_steps: (j.steps || []).filter(s => s.conclusion === 'failure').map(s => s.name)
              }));
            } catch (error) {
              report.jobs_error = error.message;
            }
            if (result === 'success') {
              try {
                const response = await github.rest.actions.listWorkflowRunArtifacts({
                  owner, repo, run_id: runId, per_page: 100
                });
                const match = response.data.artifacts.find(a => a.name === report.artifact_name);
                report.artifact_id = match ? match.id : null;
              } catch (error) {
                report.artifact_error = error.message;
              }
            }
            const path = 'build/android-last-run.json';
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner, repo, path, ref: 'android'
              });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const content = Buffer.from(JSON.stringify(report, null, 2) + '\n').toString('base64');
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: 'ci(android): save latest APK build result [skip ci]',
              content, sha, branch: 'android'
            });
            core.info('APK outcome recorded: ' + result + ', run ' + runId);
