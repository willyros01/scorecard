name: Required release checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  complete-suite:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact tools and check committed build
        run: |
          set -o pipefail
          npm install -g firebase-tools@15.31.0
          bash build/verify.sh
          bash .github/scripts/install-browsers.sh
      - name: Link and confirmation regressions
        run: |
          node test/review/link-regressions.mjs .
          node test/review/message-regressions.mjs
          node test/review/deletion-check-regressions.mjs
          node test/review/query-indexes.mjs
          node test/review/query-index-regressions.mjs
          python3 test/review/deployment-regressions.py
      - name: Complete rules, safety, migration and real app tests
        env:
          TEST_BROWSER: ${{ matrix.browser }}
        run: |
          set -o pipefail
          bash test/ops/run.sh 2>&1 | tee release-tests.log
      - name: Name the failed tests (readable without downloading the log)
        if: failure()
        run: |
          grep -E "^FAIL" release-tests.log | cut -c1-900 | head -20 | while IFS= read -r line; do echo "::error title=${{ matrix.browser }}::${line}"; done || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-tests-${{ matrix.browser }}
          path: release-tests.log
