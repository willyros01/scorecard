name: Deletion job safety tests (SEC1-SEC5)

# Runs by itself on every push to the ios branch that touches the deletion job
# or its tests. Uses the Firebase emulators only; nothing live is touched.
on:
  push:
    branches: [ios]
    paths:
      - .github/scripts/finish-deletions.sh
      - .github/scripts/save-logs.sh
      - .github/workflows/ops-tests.yml
      - test/ops/**

permissions:
  contents: write   # only to save the logs to the ci-logs branch

concurrency:
  group: ops-tests
  cancel-in-progress: false

jobs:
  sec-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Firebase emulators (exact version)
        run: npm install -g firebase-tools@15.31.0
      - name: Run SEC1-SEC5 against the emulators
        id: tests
        run: |
          set -o pipefail
          bash test/ops/run.sh 2>&1 | tee ops-tests.log
      - name: Save logs to the ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/save-logs.sh ops "${{ steps.tests.outcome }}" ops-tests.log
