name: Deletion safety tests (SEC1-SEC5, DEL1), rules tests (PRIV, ACC, PUB) and app tests (E, v2)

# Runs by itself on every push to the ios branch that touches the deletion job
# or its tests, or the Firestore rules. Uses the Firebase emulators only; nothing live is touched.
on:
  push:
    branches: [ios, v2]
    paths:
      - .github/scripts/finish-deletions.sh
      - .github/scripts/save-logs.sh
      - .github/scripts/install-browsers.sh
      - .github/workflows/ops-tests.yml
      - test/ops/**
      - test/app/**
      - firestore.rules
      - "*.js"
      - "*.html"
      - build/**
      - package.json
      - package-lock.json
      - styles.css
      - test/review/**
      - .github/workflows/release-checks.yml
      - vendor/**

permissions:
  contents: write   # only to save the logs to the ci-logs branch

concurrency:
  group: ops-tests
  cancel-in-progress: false

jobs:
  sec-tests:
    # Build 25 (22 Oct 2026): both browsers on every push, the same as the
    # release checks, so a WebKit-only failure is found before a TestFlight build.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Firebase emulators (exact version)
        run: npm install -g firebase-tools@15.31.0
      - name: App test tools - packages and a fresh Firebase bundle
        run: |
          npm ci --no-audit --no-fund
          npm run -s bundle
      # The WebKit copy of these tests is an early warning only: if Ubuntu's
      # servers stop the browser download, that copy is skipped and the run is
      # not marked failed (no email to Willy). Real test failures still fail it,
      # and the iPhone build's own release checks always require WebKit.
      - name: Test browsers (Chromium and WebKit)
        id: browsers
        continue-on-error: ${{ matrix.browser == 'webkit' }}
        run: bash .github/scripts/install-browsers.sh
      - name: Run SEC1-SEC5 and DEL1 against the emulators
        id: tests
        if: steps.browsers.outcome == 'success'
        env:
          TEST_BROWSER: ${{ matrix.browser }}
        run: |
          set -o pipefail
          bash test/ops/run.sh 2>&1 | tee ops-tests.log
      - name: Save logs to the ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/save-logs.sh "${{ matrix.browser == 'webkit' && 'ops-webkit' || 'ops' }}" "${{ steps.tests.outcome }}" ops-tests.log

