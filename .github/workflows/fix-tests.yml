name: "2.31.1 fixes - the whole test suite (both browsers)"
on:
  push:
    branches: [fix-32]
permissions:
  contents: read
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit]   # Chromium already passed every test on this code
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install -g firebase-tools@15.31.0
      - run: |
          npm ci --no-audit --no-fund
          npm run -s bundle
      - run: bash .github/scripts/install-browsers.sh
      - env:
          TEST_BROWSER: ${{ matrix.browser }}
        run: bash test/ops/run.sh 2>&1 | tee ops.log; test ${PIPESTATUS[0]} -eq 0
      - if: always()
        run: grep -E "^(FAIL|RESULT)|FAIL " ops.log | head -60 || true
