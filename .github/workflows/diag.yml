name: Diagnosis only (Willy's iPhone invitation steps) - changes nothing
on:
  push:
    branches: [diag-ow1]
permissions:
  contents: read
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install -g firebase-tools@15.31.0
      - run: |
          npm ci --no-audit --no-fund
          npm run -s bundle
      - run: bash .github/scripts/install-browsers.sh
      - env:
          TEST_BROWSER: ${{ matrix.browser }}
          ONLY: ""
        run: |
          cd test/ops
          cp ../../firestore.rules firestore.rules.copy
          firebase emulators:exec --only firestore,auth --project demo-scorecard 'node ../app/zz-diag.mjs ../..'
