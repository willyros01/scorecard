name: October review regression suite
on:
  push:
    branches: [test-review-oct2]
  pull_request:
    branches: [v2]
    paths:
      - test/app/**
      - test/review/**
      - .github/workflows/review-tests.yml
permissions:
  contents: read
jobs:
  invitation-delivery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Native launch-link regression cases
        run: node test/review/link-regressions.mjs .
  full-emulator-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the same tools as the existing operations suite
        run: |
          npm install -g firebase-tools@15.31.0
          npm ci --no-audit --no-fund
          npm run -s bundle
          npx playwright install --with-deps chromium
      - name: Existing rules, scripts and app suite plus E33 sign-out regressions
        run: |
          set -o pipefail
          bash test/ops/run.sh 2>&1 | tee review-tests.log
      - name: Keep the complete report, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-test-report
          path: review-tests.log
